<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- waveform bars -->
  <g fill="url(#bar)" opacity="0.9">
    <rect x="120" y="150" width="16" height="60" rx="4"/>
    <rect x="150" y="120" width="16" height="90" rx="4"/>
    <rect x="180" y="95" width="16" height="115" rx="4"/>
    <rect x="210" y="70" width="16" height="140" rx="4"/>
    <rect x="240" y="60" width="16" height="160" rx="4"/>
    <rect x="270" y="45" width="16" height="175" rx="4"/>
    <rect x="300" y="30" width="16" height="190" rx="4"/>
    <rect x="330" y="60" width="16" height="160" rx="4"/>
    <rect x="360" y="90" width="16" height="120" rx="4"/>
    <rect x="390" y="120" width="16" height="90" rx="4"/>
    <rect x="420" y="150" width="16" height="60" rx="4"/>
  </g>

  <!-- microphone -->
  <g transform="translate(860,150)" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round">
    <rect x="-28" y="-50" width="56" height="70" rx="28"/>
    <path d="M 0 20 v 30"/>
    <path d="M -40 30 a 40 40 0 0 0 80 0"/>
    <line x1="-30" y1="-90" x2="30" y2="-90"/>
    <line x1="-20" y1="-110" x2="20" y2="-110"/>
  </g>

  <!-- title -->
  <text x="460" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">Voice Dictation</text>
  <text x="460" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" fill="#94a3b8">Push-to-talk · WSL2 · whisper.cpp · AutoHotkey</text>
  <text x="460" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#64748b">Полностью локально · Русский · Без облачных API</text>

  <!-- pulsing rings -->
  <circle cx="860" cy="150" r="90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <circle cx="860" cy="150" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.15"/>
</svg>